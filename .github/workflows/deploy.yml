name: Deploy

# Jeder Push auf main geht automatisch live (IONOS, per SFTP).
# Unter Actions → Deploy → "Run workflow" lässt sich auch alles neu hochladen.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: 'Alle Dateien hochladen (statt nur geänderte)'
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Hochladen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
          FULL: ${{ inputs.full }}
        run: bash .github/deploy.sh
